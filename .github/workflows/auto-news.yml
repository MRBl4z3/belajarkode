name: Auto Fetch News RSS

on:
  schedule:
    # Berjalan setiap 12 jam (jam 00:00 & 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Fetch Script
        run: bun scripts/fetch-news.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/news/ scripts/processed-news.json
          git status
          if git diff --staged --quiet; then
            echo "Tidak ada berita baru."
          else
            git commit -m "chore(news): auto update news from RSS feeds [skip ci]"
            git push
          fi